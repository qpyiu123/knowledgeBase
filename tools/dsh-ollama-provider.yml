# 把本地 Ollama 作为独立提供商接进 DeepSeek Harness
#
# 用途：在 DSH 的模型选择器里多一个「Ollama 本地」路由，用 RTX 3050 Ti 跑
#      qwen2.5-coder-7b，不消耗 API 额度。
#
# ─────────────────────────────────────────────────────────────────────────
# 方式一（推荐）：写进 profile 补丁层
#   把下面的 `- id: llm-pi-ai` 条目追加到
#   C:\Users\12176\.dsh\profiles\desktop\cordis.patch.yml
#   的 `providers:` 下面（不要新起一个 - id: llm-pi-ai 块，会和已有的合并冲突）。
#   改完重启 DSH。
#
# 方式二：在 DSH 设置界面「模型 / Providers」里新增路由，字段按下方填写。
# ─────────────────────────────────────────────────────────────────────────

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      # ↓↓↓ 把这一段加进已有的 providers: 映射里 ↓↓↓
      ollama-local:
        displayName: Ollama 本地 (RTX 3050Ti)
        # Ollama 不校验 key，但 pi-ai 的发现请求会带 bearer，随便给个值即可
        apiKeyEnv: OLLAMA_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        # 4GB 显存下的关键参数，见 README
        defaultContextWindow: 6144
        defaultMaxTokens: 2048
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: qwen25-coder-7b-local:latest
            name: Qwen2.5-Coder 7B (本地)
            contextWindow: 6144
            maxTokens: 2048
            input:
              - text
            reasoningEfforts: false        # 非推理模型
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              supportsStrictMode: false
          - id: qwen25c7b-gpu14:latest
            name: Qwen2.5-Coder 7B (14层卸载)
            contextWindow: 6144
            maxTokens: 2048
            input:
              - text
            reasoningEfforts: false
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              supportsStrictMode: false
          - id: qwen25c7b-cpu0:latest
            name: Qwen2.5-Coder 7B (纯CPU)
            contextWindow: 6144
            maxTokens: 2048
            input:
              - text
            reasoningEfforts: false
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              supportsStrictMode: false
