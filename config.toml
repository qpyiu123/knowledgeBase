[kb]
root = "."
kb_dir = "kb"
index_dir = "index"
models_dir = "models"

[runtime]
# auto：先用 runtime/python-portable/python.exe，再用项目 .venv。
# 可填项目相对路径或完整路径；-PythonExe、KB_PYTHON 可临时覆盖。
python = "auto"

[search]
top_k = 8
rrf_k = 60
chunk_chars = 900
chunk_overlap = 120

[embed]
model_dir = "models/bge-small-zh-v1.5"
model_id = "BAAI/bge-small-zh-v1.5"
# 实际使用 ONNX 导出（onnxruntime + tokenizers，零 torch，约 1.3 ms/条）
onnx_dir = "models/bge-small-zh-v1.5-onnx"
gguf_fallback = "models/gguf/bge-small-zh-v1.5-q8_0.gguf"
query_prefix = "为这个句子生成表示以用于检索相关文章："
batch_size = 32

[llm]
backend = "llama_server"
gguf_path = "models/gguf/Qwen3.5-9B-Q4_K_M.gguf"
chat_format = "chatml"
n_ctx = 8192
n_gpu_layers = 99
kv_cache_type = "q8_0"
n_threads = 6
n_batch = 256
temperature = 0.2
max_tokens = 1200
timeout = 300
keep_alive = "30m"
# 独占显存时的最优值：18 层卸载 + 8192 上下文 = 19.0 tok/s（显存 3846/4096 MB）
# 若有其它程序抢显存，降到 16（17.8 tok/s）或 14 更稳
ollama_num_gpu = 18

[llama_server]
# 可用 qwen35-9b / qwen35-4b；KB_CHAT_MODEL、start.ps1 -ChatModel 可显式覆盖。
model = "qwen35-9b"
runtime = "runtime/llama-b11669-vulkan"
port = 8766
device = "auto"

[ollama]
# server.py 与 kb.llm 都从这里读；AGENT_OLLAMA / AGENT_MODEL 仅做显式覆盖。
# 本机实际 manifest 名为 qwen2.5-coder-7b:local，server 会按 /api/tags 自动解析。
host = "http://127.0.0.1:11434"
model = "qwen2.5-coder-7b"

[feedback]
# P1 反馈记录：只追加本地 JSONL，不参与检索排序。
file = "work/feedback/feedback.jsonl"

[attachment]
# P2 附件侦察：上传副本落到独立随机目录，只读解析，永不执行。
# AGENT_ATTACHMENT_DIR / AGENT_ATTACHMENT_MAX_BYTES 只做显式覆盖。
dir = "work/attachments"
max_bytes = 8388608

[workspace]
# P3 题目工作区：一个工作区一个 JSON 文件，本地保存、可导出。
# AGENT_WORKSPACE_DIR 只做显式覆盖；work/ 不入库。
dir = "work/workspaces"
